name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "NightcoreFloating.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Extract project
        shell: bash
        run: |
          rm -rf project
          mkdir -p project
          unzip -q NightcoreFloating.zip -d project
          if [ -f project/NightcoreFloating/settings.gradle ]; then
            echo "PROJECT_DIR=project/NightcoreFloating" >> "$GITHUB_ENV"
          elif [ -f project/settings.gradle ]; then
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          else
            echo "Gradle project not found" >&2
            find project -maxdepth 3 -type f | head -50
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NightcoreFloating-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v6.${{ github.run_number }}"
          name: "Nightcore Floating v6.${{ github.run_number }}"
          files: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          prerelease: false
